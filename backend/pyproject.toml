[project]
name = "research-workbench-api"
version = "0.1.0"
description = "Target Scout + Target Challenger Flask API (stateless; runs locally and as a Vercel Function)"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (used by the local venv and the README).
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31",
    "google-genai>=3.0,<4",
    "pydantic>=2.8,<3",
]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
